en: |
  Cybersecurity expert and former ethical hacker specializing in social engineering, penetration testing, and security awareness.
  Founder of Mitnick Security and former Chief Hacking Officer at KnowBe4.
  Internationally recognized author, speaker, and consultant who helped organizations strengthen their human and technical defenses.
  Translated first-hand hacking experience into practical strategies for preventing phishing, fraud, and cyberattacks.

fr: |
  Expert en cybersécurité et ancien hacker éthique, spécialisé en ingénierie sociale, tests d’intrusion et sensibilisation à la sécurité.
  Fondateur de Mitnick Security et ancien Chief Hacking Officer chez KnowBe4.
  Auteur, conférencier et consultant reconnu à l’international, il a accompagné les organisations dans le renforcement de leurs défenses humaines et techniques.
  Il a transformé son expérience du hacking en stratégies concrètes pour prévenir le phishing, la fraude et les cyberattaques.

